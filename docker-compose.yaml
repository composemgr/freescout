# nginx proxy address - http://172.17.0.1:8090

name: freescout
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  app:
    image: tiredofit/freescout:latest
    pull_policy: always
    container_name: freescout-app
    restart: always
    logging: *default-logging
    networks:
      - freescout
      - proxy
      - cloudflare
    ports:
      - "172.17.0.1:8090:80"
    environment:
      TZ: ${TZ:-America/New_York}
      SITE_URL: http://${BASE_HOST_NAME:-$HOSTNAME}
      DB_HOST: freescout-db
      DB_PORT: 3306
      DB_NAME: ${DB_CREATE_DATABASE_NAME:-freescout}
      DB_USER: ${DB_USER_NAME:-freescout}
      DB_PASS: ${DB_USER_PASS:-changeme_db_password}
      ADMIN_EMAIL: ${APP_ADMIN_USER:-admin@example.com}
      ADMIN_PASS: ${APP_ADMIN_PASS:-changeme_admin_password}
      APP_NAME: ${APP_NAME:-FreeScout}
      APP_ENV: production
      APP_KEY: ${APP_SECRET_KEY:-changeme_secret_key_min_32_chars}
      APP_URL: http://${BASE_HOST_NAME:-$HOSTNAME}
      SMTP_HOST: ${EMAIL_SERVER_HOST:-172.17.0.1}
      SMTP_PORT: ${EMAIL_SERVER_PORT:-587}
      SMTP_USER: ${EMAIL_SERVER_LOGIN_NAME:-}
      SMTP_PASS: ${EMAIL_SERVER_LOGIN_PASS:-}
      MAIL_FROM_ADDRESS: ${EMAIL_SERVER_MAIL_FROM:-noreply@example.com}
      CONTAINER_NAME: freescout-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    volumes:
      - ./volumes/data/freescout:/data
      - ./volumes/logs/freescout:/www/logs
    depends_on:
      - freescout-db
    labels:
      - 'traefik.enable=true'
      - 'cloudflare.enable=true'
      - 'traefik.docker.network=proxy'
      - 'cloudflare.service=http://freescout-app:80'
      - 'cloudflare.hostname=freescout.${CLOUDFLARE_ZONE_NAME:-}'
      - 'traefik.http.routers.freescout-app.entrypoints=http'
      - 'traefik.http.routers.freescout-app-secure.tls=true'
      - 'traefik.http.routers.freescout-app.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.middlewares.freescout-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.freescout-app.middlewares=freescout-app-https-redirect'
      - 'traefik.http.routers.freescout-app-secure.entrypoints=https'
      - 'traefik.http.routers.freescout-app-secure.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.routers.freescout-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.freescout-app-secure.service=freescout-app'
      - 'traefik.http.services.freescout-app.loadbalancer.server.port=80'

  freescout-db:
    image: mariadb:latest
    pull_policy: always
    container_name: freescout-db
    restart: always
    logging: *default-logging
    networks:
      - freescout
    environment:
      TZ: ${TZ:-America/New_York}
      MARIADB_DATABASE: ${DB_CREATE_DATABASE_NAME:-freescout}
      MARIADB_USER: ${DB_USER_NAME:-freescout}
      MARIADB_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      MARIADB_ROOT_PASSWORD: ${DB_ADMIN_PASS:-changeme_admin_password}
      CONTAINER_NAME: freescout-db
    volumes:
      - ./volumes/data/db/mariadb/freescout:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  freescout:
    name: freescout
    external: false
  proxy:
    external: true
  cloudflare:
    external: true
